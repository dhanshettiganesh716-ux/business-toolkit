<!-- FEEDBACK BUTTON -->
<button class="feedback-btn" onclick="openFeedback()">
  ⭐ Feedback
</button>

<!-- FEEDBACK POPUP -->
<div id="feedbackBox" class="feedback-box">
  <div class="feedback-card">

    <span class="feedback-close" onclick="closeFeedback()">×</span>

    <h2>⭐ Business Toolkit Feedback</h2>
    <p>तुमचा feedback आमच्यासाठी खूप महत्त्वाचा आहे.</p>

    <div class="feedback-option">
      <label>1. Business Toolkit तुम्हाला किती आवडलं?</label>

      <select id="q1">
        <option value="">Select</option>
        <option>⭐ 1</option>
        <option>⭐⭐ 2</option>
        <option>⭐⭐⭐ 3</option>
        <option>⭐⭐⭐⭐ 4</option>
        <option>⭐⭐⭐⭐⭐ 5</option>
      </select>
    </div>

    <div class="feedback-option">
      <label>2. Business Toolkit मध्ये काय सुधारणा पाहिजे?</label>

      <select id="q2">
        <option value="">Select</option>
        <option>📱 वापरणं आणखी सोपं हवं</option>
        <option>⚡ Website आणखी fast हवी</option>
        <option>🎨 Design आणखी चांगलं हवं</option>
        <option>🧾 आणखी हिसाब-किताब features पाहिजेत</option>
        <option>📊 Reports / Summary पाहिजे</option>
        <option>📦 Stock Management सुधारायला हवं</option>
        <option>👥 Udhaar Management सुधारायला हवं</option>
        <option>🔔 Notifications पाहिजेत</option>
        <option>✅ काही सुधारणा नको</option>
      </select>
    </div>

    <div class="feedback-option">
      <label>3. कोणता feature सर्वात उपयोगी वाटला?</label>

      <select id="q3">
        <option value="">Select</option>
        <option>🧾 Invoice</option>
        <option>💰 Sales</option>
        <option>💸 Expenses</option>
        <option>📈 Profit</option>
        <option>👤 Customers / Udhaar</option>
        <option>📦 Stock</option>
        <option>🧮 GST Calculator</option>
      </select>
    </div>

    <div class="feedback-option">
      <label>4. तुम्ही Business Toolkit पुन्हा वापराल का?</label>

      <select id="q4">
        <option value="">Select</option>
        <option>👍 हो</option>
        <option>🤔 कदाचित</option>
        <option>👎 नाही</option>
      </select>
    </div>

    <button class="feedback-submit" onclick="submitFeedback()">
      Submit Feedback
    </button>

  </div>
</div>

<!-- JS FILE -->
<script src="script.js"></script>
