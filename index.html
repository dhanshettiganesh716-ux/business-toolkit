<section id="invoice" class="page">
  <div class="box">
    <h2>Create Invoice</h2>

    <div class="form-grid">
      <input id="invoiceNo" placeholder="Invoice Number">
      <input id="invoiceCustomer" placeholder="Customer Name">
    </div>

    <div class="shop-receipt">

      <div class="receipt-header">
        <h3>BUSINESS TOOLKIT</h3>
        <p>TAX INVOICE</p>
      </div>

      <div class="receipt-info">
        <span>Invoice: <b id="receiptInvoiceNo">---</b></span>
        <span>Date: <b id="receiptDate"></b></span>
      </div>

      <div class="receipt-customer">
        Customer: <b id="receiptCustomer">---</b>
      </div>

      <div class="receipt-line"></div>

      <div class="receipt-head">
        <span>Product</span>
        <span>Qty</span>
        <span>Rate</span>
        <span>Amount</span>
      </div>

      <div id="invoiceBody"></div>

      <div class="receipt-line"></div>

      <div class="receipt-actions">
        <button class="primary" onclick="addProduct()">+ Add Product</button>
      </div>

      <div class="receipt-summary">
        <div>
          <span>Subtotal</span>
          <b>₹<span id="invoiceSubtotal">0.00</span></b>
        </div>

        <div>
          <span>GST</span>
          <b>₹<span id="invoiceGST">0.00</span></b>
        </div>

        <div class="grand-total">
          <span>GRAND TOTAL</span>
          <b>₹<span id="invoiceGrandTotal">0.00</span></b>
        </div>
      </div>

      <div class="receipt-line"></div>

      <div class="thank-you">
        <b>Thank You!</b>
        <small>Visit Again</small>
      </div>

    </div>

    <div class="actions">
      <button class="primary" onclick="saveInvoice()">Save Invoice</button>
      <button class="primary" onclick="window.print()">Print</button>
    </div>

  </div>
</section>
