<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Toolkit - Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="receipt">

        <div class="shop-header">
            <h1 id="shopName">माझे दुकान</h1>
            <p id="shopAddress">दुकानाचा पत्ता</p>
            <p>मोबाईल: 0000000000</p>
        </div>

        <div class="receipt-info">
            <div>
                पावती नं.: <strong id="receiptNo">00001</strong>
            </div>

            <div>
                तारीख: <strong id="receiptDate"></strong>
            </div>
        </div>

        <div class="customer">
            <label>ग्राहकाचे नाव</label>
            <input type="text" id="customerName" placeholder="नाव लिहा">
        </div>

        <table>
            <thead>
                <tr>
                    <th>वस्तू</th>
                    <th>Qty</th>
                    <th>दर</th>
                    <th>रक्कम</th>
                    <th class="no-print">X</th>
                </tr>
            </thead>

            <tbody id="items"></tbody>
        </table>

        <button class="add-btn no-print" onclick="addItem()">
            + वस्तू जोडा
        </button>

        <div class="total-section">

            <p>
                एकूण:
                <strong>₹<span id="total">0.00</span></strong>
            </p>

            <p>
                पेमेंट:
                <select id="payment">
                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Card</option>
                </select>
            </p>

        </div>

        <div class="thanks">
            <p>धन्यवाद! पुन्हा भेट द्या 🙏</p>
        </div>

        <button class="print-btn no-print" onclick="printReceipt()">
            🖨️ पावती Print करा
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
