<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दुकान की पावती / रसीद</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* असली दुकान की रसीद की स्टाइल (Thermal Receipt Style) */
        .receipt-box {
            width: 320px; /* मानक थर्मल प्रिंटर चौड़ाई */
            background: #fff;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace; /* टाइपराइटर / बिल प्रिंटर फ़ॉन्ट */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 1px solid #ddd;
        }

        .dashed-line {
            border-bottom: 1px dashed #000;
            margin: 8px 0;
        }

        /* प्रिंट के समय केवल रसीद दिखेगी */
        @media print {
            body * {
                visibility: hidden;
            }
            #receipt-print-area, #receipt-print-area * {
                visibility: visible;
            }
            #receipt-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
                border: none;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-200 p-4 min-h-screen">

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 1. फॉर्म (यहाँ जानकारी भरें) -->
        <div class="bg-white p-6 rounded-lg shadow-md no-print">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">🧾 दुकान की पर्ची बनाएँ</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">दुकान का नाम</label>
                    <input type="text" id="shopName" value="श्री गणेश जनरल स्टोर्स" oninput="updateReceipt()" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600">पता / मोबाइल नंबर</label>
                    <input type="text" id="shopContact" value="मेन रोड, बाजार पेठ | मो: 9876543210" oninput="updateReceipt()" class="w-full border p-2 rounded text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600">ग्राहक का नाम</label>
                        <input type="text" id="custName" placeholder="उदा. राहुल शर्मा" oninput="updateReceipt()" class="w-full border p-2 rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600">तारीख</label>
                        <input type="date" id="invDate" onchange="updateReceipt()" class="w-full border p-2 rounded text-sm">
                    </div>
                </div>

                <!-- सामान जोड़ने का सेक्शन -->
                <div class="mt-4">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold uppercase text-gray-600">सामान की सूची</label>
                        <button onclick="addItemRow()" class="bg-blue-600 text-white text-xs px-3 py-1 rounded hover:bg-blue-700">+ सामान जोड़ें</button>
                    </div>
                    <div id="items-container" class="space-y-2"></div>
                </div>

                <div class="pt-4 border-t">
                    <button onclick="window.print()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded shadow hover:bg-green-700 flex justify-center items-center gap-2">
                        <span>🖨️</span> रसीद प्रिंट करें / PDF सेव करें
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. असली दुकान जैसी लाइव पर्ची (Real Paper Receipt) -->
        <div class="flex justify-center items-start">
            <div id="receipt-print-area" class="receipt-box text-black">
                
                <!-- दुकान का हेडर -->
                <div class="text-center">
                    <h1 class="text-lg font-bold uppercase tracking-wider" id="viewShopName">श्री गणेश जनरल स्टोर्स</h1>
                    <p class="text-xs" id="viewShopContact">मेन रोड, बाजार पेठ | मो: 9876543210</p>
                    <div class="dashed-line"></div>
                    <p class="text-xs font-bold">*** कैश मेमो / CASH MEMO ***</p>
                    <div class="dashed-line"></div>
                </div>

                <!-- बिल डिटेल्स -->
                <div class="text-xs space-y-1">
                    <div><strong>ग्राहक:</strong> <span id="viewCustName">नगद</span></div>
                    <div><strong>तारीख:</strong> <span id="viewDate">-</span></div>
                </div>

                <div class="dashed-line"></div>

                <!-- सामान की तालिका -->
                <table class="w-full text-xs text-left">
                    <thead>
                        <tr class="font-bold border-b border-black">
                            <th class="py-1">सामान</th>
                            <th class="text-center">मात्रा</th>
                            <th class="text-right">दर</th>
                            <th class="text-right">कुल</th>
                        </tr>
                    </thead>
                    <tbody id="viewTableBody">
                        <!-- लाइव डेटा यहाँ दिखेगा -->
                    </tbody>
                </table>

                <div class="dashed-line"></div>

                <!-- कुल योग -->
                <div class="flex justify-between font-bold text-sm">
                    <span>कुल राशि (TOTAL):</span>
                    <span>₹<span id="viewTotal">0.00</span></span>
                </div>

                <div class="dashed-line"></div>

                <!-- फुटर -->
                <div class="text-center text-xs space-y-1 mt-2">
                    <p>*** धन्यवाद! फिर पधारें ***</p>
                    <p class="text-[10px] text-gray-500">(बिका हुआ सामान वापस नहीं होगा)</p>
                </div>

            </div>
        </div>

    </div>

    <script>
        // आज की तारीख सेट करें
        document.getElementById('invDate').valueAsDate = new Date();

        window.onload = function() {
            addItemRow();
            updateReceipt();
        };

        // सामान की नई रो जोड़ें
        function addItemRow() {
            const container = document.getElementById('items-container');
            const rowId = Date.now();
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center item-row';
            row.id = `row-${rowId}`;
            row.innerHTML = `
                <input type="text" placeholder="सामान" oninput="updateReceipt()" class="item-name border p-1.5 rounded w-1/2 text-sm">
                <input type="number" placeholder="मात्रा" value="1" oninput="updateReceipt()" class="item-qty border p-1.5 rounded w-1/5 text-sm text-center">
                <input type="number" placeholder="दर ₹" oninput="updateReceipt()" class="item-rate border p-1.5 rounded w-1/4 text-sm text-right">
                <button onclick="removeRow('row-${rowId}')" class="text-red-500 font-bold px-1">✕</button>
            `;
            container.appendChild(row);
            updateReceipt();
        }

        function removeRow(id) {
            const row = document.getElementById(id);
            if(row) {
                row.remove();
                updateReceipt();
            }
        }

        // लाइव रसीद अपडेट करें
        function updateReceipt() {
            document.getElementById('viewShopName').innerText = document.getElementById('shopName').value || 'दुकान का नाम';
            document.getElementById('viewShopContact').innerText = document.getElementById('shopContact').value || '-';
            document.getElementById('viewCustName').innerText = document.getElementById('custName').value || 'नगद';
            document.getElementById('viewDate').innerText = document.getElementById('invDate').value || '-';

            const tbody = document.getElementById('viewTableBody');
            tbody.innerHTML = '';

            let grandTotal = 0;
            const rows = document.querySelectorAll('.item-row');

            rows.forEach(row => {
                const name = row.querySelector('.item-name').value;
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const total = qty * rate;

                if (name.trim() !== '') {
                    grandTotal += total;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-1">${name}</td>
                        <td class="text-center">${qty}</td>
                        <td class="text-right">${rate.toFixed(2)}</td>
                        <td class="text-right font-bold">${total.toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-2 text-gray-400">सामान जोड़ें...</td></tr>`;
            }

            document.getElementById('viewTotal').innerText = grandTotal.toFixed(2);
        }
    </script>
</body>
</html>
