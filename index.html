<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Toolkit</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
  <div>
    <h1>Business Toolkit</h1>
    <p>Smart Business Management</p>
  </div>

  <div class="profile">G</div>
</header>


<!-- NAVIGATION -->

<nav class="navigation">

  <button onclick="showPage('invoice')" class="nav-btn active">
    🧾 Invoice
  </button>

  <button onclick="showPage('sales')" class="nav-btn">
    💰 Sales
  </button>

  <button onclick="showPage('customers')" class="nav-btn">
    👥 Customers
  </button>

  <button onclick="showPage('profit')" class="nav-btn">
    📈 Profit
  </button>

  <button onclick="showPage('gst')" class="nav-btn">
    🧮 GST
  </button>

  <button onclick="showPage('stock')" class="nav-btn">
    📦 Stock
  </button>

  <button onclick="showPage('expenses')" class="nav-btn">
    💸 Expenses
  </button>

</nav>


<main>


<!-- ================= INVOICE ================= -->

<section id="invoice" class="page active-page">

  <h2>Create Invoice</h2>
  <p class="subtitle">Create your business invoice</p>

  <div class="form-card">

    <label>Name Customer</label>
    <input id="invoiceCustomer"
           type="text"
           placeholder="Customer name">

    <label>Mobile No.</label>
    <input id="invoiceMobile"
           type="text"
           placeholder="Mobile No.">

    <label>Product</label>
    <input id="invoiceProduct"
           type="text"
           placeholder="Product">

    <label>Quantity</label>
    <input id="invoiceQuantity"
           type="number"
           placeholder="Quantity">

    <label>Price</label>
    <input id="invoicePrice"
           type="number"
           placeholder="Price">

    <label>Total</label>
    <input id="invoiceTotal"
           type="text"
           value="₹0.00"
           readonly>

    <label>GST %</label>
    <input id="invoiceGST"
           type="number"
           value="18">

    <button class="main-btn" onclick="generateInvoice()">
      Create Invoice
    </button>

  </div>

  <div id="invoiceOutput"></div>

</section>



<!-- ================= SALES ================= -->

<section id="sales" class="page">

  <h2>Sales</h2>
  <p class="subtitle">Manage your sales</p>

  <div class="form-card">

    <label>Product</label>
    <input id="salesProduct"
           type="text"
           placeholder="Product">

    <label>Quantity</label>
    <input id="salesQuantity"
           type="number"
           placeholder="Quantity">

    <label>Price</label>
    <input id="salesPrice"
           type="number"
           placeholder="Price">

    <label>Total Sales</label>
    <input id="salesTotal"
           type="text"
           value="₹0.00"
           readonly>

    <button class="main-btn" onclick="calculateSales()">
      Save Sale
    </button>

  </div>

  <button class="print-btn" onclick="printSection('sales')">
    🖨️ Print / Save PDF
  </button>

</section>



<!-- ================= CUSTOMERS ================= -->

<section id="customers" class="page">

  <h2>Customers</h2>
  <p class="subtitle">Manage customer credit / khata</p>

  <div class="form-card">

    <label>Customer Name</label>
    <input id="customerName"
           type="text"
           placeholder="Customer name">

    <label>Mobile No.</label>
    <input id="customerMobile"
           type="text"
           placeholder="Mobile No.">

    <label>Credit Amount</label>
    <input id="customerCredit"
           type="number"
           placeholder="₹ Amount">

    <button class="main-btn" onclick="saveCustomer()">
      Add Customer
    </button>

  </div>

  <div id="customerList"></div>

  <button class="print-btn" onclick="printSection('customers')">
    🖨️ Print / Save PDF
  </button>

</section>



<!-- ================= PROFIT ================= -->

<section id="profit" class="page">

  <h2>Profit</h2>
  <p class="subtitle">Calculate your business profit</p>

  <div class="form-card">

    <label>Total Sales</label>
    <input id="profitSales"
           type="number"
           placeholder="₹ Sales">

    <label>Total Expenses</label>
    <input id="profitExpenses"
           type="number"
           placeholder="₹ Expenses">

    <label>Profit</label>
    <input id="profitResult"
           type="text"
           value="₹0.00"
           readonly>

    <button class="main-btn" onclick="calculateProfit()">
      Calculate Profit
    </button>

  </div>

  <button class="print-btn" onclick="printSection('profit')">
    🖨️ Print / Save PDF
  </button>

</section>



<!-- ================= GST ================= -->

<section id="gst" class="page">

  <h2>GST</h2>
  <p class="subtitle">GST calculator</p>

  <div class="form-card">

    <label>Amount</label>
    <input id="gstAmount"
           type="number"
           placeholder="₹ Amount">

    <label>GST Rate %</label>
    <input id="gstRate"
           type="number"
           value="18">

    <label>GST Amount</label>
    <input id="gstResult"
           type="text"
           value="₹0.00"
           readonly>

    <label>Final Amount</label>
    <input id="gstFinal"
           type="text"
           value="₹0.00"
           readonly>

    <button class="main-btn" onclick="calculateGST()">
      Calculate GST
    </button>

  </div>

  <button class="print-btn" onclick="printSection('gst')">
    🖨️ Print / Save PDF
  </button>

</section>



<!-- ================= STOCK ================= -->

<section id="stock" class="page">

  <h2>Stock</h2>
  <p class="subtitle">Manage your inventory</p>

  <div class="form-card">

    <label>Product</label>
    <input id="stockProduct"
           type="text"
           placeholder="Product">

    <label>Quantity</label>
    <input id="stockQuantity"
           type="number"
           placeholder="Quantity">

    <label>Purchase Price</label>
    <input id="purchasePrice"
           type="number"
           placeholder="₹ Purchase Price">

    <label>Selling Price</label>
    <input id="sellingPrice"
           type="number"
           placeholder="₹ Selling Price">

    <button class="main-btn" onclick="saveStock()">
      Add Stock
    </button>

  </div>

  <div id="stockList"></div>

  <button class="print-btn" onclick="printSection('stock')">
    🖨️ Print / Save PDF
  </button>

</section>



<!-- ================= EXPENSES ================= -->

<section id="expenses" class="page">

  <h2>Expenses</h2>
  <p class="subtitle">Manage your business expenses</p>

  <div class="form-card">

    <label>Expense Name</label>
    <input id="expenseName"
           type="text"
           placeholder="Expense name">

    <label>Amount</label>
    <input id="expenseAmount"
           type="number"
           placeholder="₹ Amount">

    <label>Date</label>
    <input id="expenseDate"
           type="date">

    <button class="main-btn" onclick="saveExpense()">
      Add Expense
    </button>

  </div>

  <div id="expenseList"></div>

  <button class="print-btn" onclick="printSection('expenses')">
    🖨️ Print / Save PDF
  </button>

</section>


</main>

<script src="script.js"></script>

</body>
</html>
