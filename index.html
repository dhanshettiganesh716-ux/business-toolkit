<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Toolkit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Business Toolkit</h1>
        <p>Manage Your Business</p>
    </header>

    <main>

        <h2>Dashboard</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Total Sales</h3>
                <p id="sales">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0</p>
            </div>

            <div class="card">
                <h3>Profit</h3>
                <p id="profit">₹0</p>
            </div>

            <div class="card">
                <h3>Customers</h3>
                <p id="customers">0</p>
            </div>

        </div>

        <section class="box">

            <h2>Add Sale</h2>

            <input
                type="number"
                id="saleAmount"
                placeholder="Enter sale amount"
            >

            <button onclick="addSale()">Add Sale</button>

        </section>

        <section class="box">

            <h2>Add Expense</h2>

            <input
                type="number"
                id="expenseAmount"
                placeholder="Enter expense amount"
            >

            <button onclick="addExpense()">Add Expense</button>

        </section>

        <section class="box">

            <h2>Customers</h2>

            <button onclick="addCustomer()">Add Customer</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
