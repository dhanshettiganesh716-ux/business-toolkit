<!-- CUSTOMERS -->
<section id="customers" class="page">

  <div class="page-title">
    <h2>Customers</h2>
    <p>Manage customer credit / khata</p>
  </div>

  <div class="card">

    <div class="input-group">
      <label>Customer Name</label>

      <input
        id="customer"
        type="text"
        placeholder="Customer name">
    </div>

    <div class="input-group">
      <label>Credit Amount</label>

      <input
        id="credit"
        type="number"
        placeholder="₹ Amount">
    </div>

    <button class="primary-btn"
      onclick="addCustomer()">
      Add Customer
    </button>

    <div id="customerResult"></div>

    <!-- CUSTOMER PRINT BUTTON -->
    <button class="print-btn"
      onclick="printCustomers()">
      🖨️ Print / Save PDF
    </button>

  </div>

</section>
