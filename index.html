<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Toolkit</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f5ff;
  color:#25233a;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:230px;
  background:#211d3a;
  color:white;
  padding:20px 12px;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  overflow-y:auto;
}

.logo{
  font-size:24px;
  font-weight:bold;
  padding:10px 12px 25px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd9f5;
  text-align:left;
  padding:13px 15px;
  margin:3px 0;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.nav-btn:hover,
.nav-btn.active{
  background:#7467d9;
  color:white;
}

/* MAIN */
.main{
  margin-left:230px;
  width:calc(100% - 230px);
  padding:25px;
}

.header{
  margin-bottom:25px;
}

.header h1{
  font-size:28px;
}

.header p{
  color:#777;
  margin-top:5px;
}

/* PAGES */
.page{
  display:none;
}

.page.active{
  display:block;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
